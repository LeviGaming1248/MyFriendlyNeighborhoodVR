[Camera]

## Allow MFN to move the VR camera during interaction menus. Cutscenes and toolbox views always retain their authored camera movement.
# Setting type: Boolean
# Default value: true
InteractionCameraMovement = true

[Controls]

## When true, right grip switches weapons only at physical holsters: right hip cycles Wrench/Punctuation and behind the right shoulder cycles Rolodexer/Novelist/Conclusion. Normal right-grip weapon switching is disabled.
# Setting type: Boolean
# Default value: true
PhysicalWeaponSwitching = true

[Crosshair]

## Show the VR crosshair.
# Setting type: Boolean
# Default value: true
Enabled = true

## Crosshair distance in metres.
# Setting type: Single
# Default value: 1.08
# Acceptable value range: From 0.25 to 10
Distance = 1.08

## World-space crosshair size.
# Setting type: Single
# Default value: 0.011
# Acceptable value range: From 0.002 to 0.05
Size = 0.011

[HUD]

## Virtual HUD distance in metres.
# Setting type: Single
# Default value: 1000
# Acceptable value range: From 0.5 to 1000
Distance = 1000

## HUD angular scale.
# Setting type: Single
# Default value: 0.78
# Acceptable value range: From 0.25 to 2
Scale = 0.78

## HUD vertical offset in metres.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -2 to 2
HeightOffset = 0

[MainMenu]

## Fixed main-menu distance in metres.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 20
Distance = 10

## Fixed main-menu size multiplier.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.25 to 2
Scale = 1

[Rendering]

## Fixed eye resolution and dynamic-resolution maximum.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 1.5
ResolutionScale = 1

## Enable automatic GPU-timing-based resolution adjustment.
# Setting type: Boolean
# Default value: false
DynamicResolution = true

## Minimum automatic resolution scale.
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0.5 to 1.5
DynamicResolutionMinScale = 0.7

## Dynamic-resolution performance target.
# Setting type: Single
# Default value: 80
# Acceptable value range: From 45 to 144
DynamicResolutionTargetFPS = 80

[Turning]

## Enable continuous smooth turning. Set false to use snap turning.
# Setting type: Boolean
# Default value: false
SmoothTurning = true

## Degrees per snap turn.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 15 to 90
SnapAngle = 30

## Smooth turning speed in degrees per second.
# Setting type: Single
# Default value: 90
# Acceptable value range: From 30 to 360
SmoothTurnSpeed = 90

[UI]

## When true, only the main menu, pause menu, and Files menu use a flat VR screen. Other interfaces use MFN's real camera position. Set false to use flat screens for every non-gameplay interface.
# Setting type: Boolean
# Default value: true
UIScreens = true

## Show a tracked right-hand pointer in inventory, toolboxes, and interaction menus. Right trigger selects or picks up/places items; right-stick click rotates held inventory items.
# Setting type: Boolean
# Default value: true
MenuPointer = true

